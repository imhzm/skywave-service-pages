<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">رسم توضيحي لمتابعة نمو الشعر بين جلسات الليزر</title>
  <desc id="desc">مقطع مبسط لسطح البشرة مع عدد أقل من الشعيرات الظاهرة، لأغراض الشرح فقط وليس نتيجة علاجية.</desc>
