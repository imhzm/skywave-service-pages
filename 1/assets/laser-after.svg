    <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#f2cbb4"/><stop offset="1" stop-color="#dfa88e"/></linearGradient>
    <linearGradient id="follicle" x2="0" y2="1"><stop stop-color="#a96852"/><stop offset="1" stop-color="#79463d"/></linearGradient>
  </defs>
  <rect width="720" height="480" fill="url(#bg)"/>
  <circle cx="584" cy="97" r="82" fill="#fff" opacity=".32"/>
  <path d="M0 238c89-18 141 17 225 3s140-23 226-2 170 9 269-5v246H0Z" fill="url(#skin)"/>
  <path d="M0 238c89-18 141 17 225 3s140-23 226-2 170 9 269-5" fill="none" stroke="#c8836f" stroke-width="5"/>
