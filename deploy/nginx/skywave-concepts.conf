map $host $skywave_concept_root {
    default                     /var/www/skywave-service-pages/current/1;
    clinics.skywaveads.com      /var/www/skywave-service-pages/current/1;
    realestate.skywaveads.com   /var/www/skywave-service-pages/current/2;
    automation.skywaveads.com   /var/www/skywave-service-pages/current/3;
}

server {
    listen 80;
    listen [::]:80;
    server_name clinics.skywaveads.com realestate.skywaveads.com automation.skywaveads.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/skywave-service-pages/shared;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clinics.skywaveads.com realestate.skywaveads.com automation.skywaveads.com;

    root $skywave_concept_root;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/clinics.skywaveads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinics.skywaveads.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/skywave-concepts.access.log;
    error_log /var/log/nginx/skywave-concepts.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|woff2|svg|webp|jpe?g|png)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
