server {
    listen 80;
    listen [::]:80;
    server_name clinics.skywaveads.com;

    root /var/www/skywave-service-pages/current/1;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/skywave-clinics.access.log;
    error_log /var/log/nginx/skywave-clinics.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|webp|woff2)$ {
        try_files $uri =404;
        expires 7d;
    }
}

